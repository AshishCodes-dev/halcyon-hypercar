<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Halcyon | Concept Electric Hypercar</title>
    <meta name="description" content="Halcyon is a fictional electric hypercar brand: a cinematic concept website with scroll-driven 3D, a live accent system and a reservation demo." />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />

    <!-- Open Graph tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Halcyon | Concept Electric Hypercar" />
    <meta property="og:description" content="Halcyon is a fictional electric hypercar brand: a cinematic concept website with scroll-driven 3D, a live accent system and a reservation demo." />
    <meta property="og:site_name" content="Halcyon" />

    <!-- Twitter Card tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Halcyon | Concept Electric Hypercar" />
    <meta name="twitter:description" content="Halcyon is a fictional electric hypercar brand: a cinematic concept website with scroll-driven 3D, a live accent system and a reservation demo." />

    <!-- og:image and twitter:image will be added after deploy once the production domain is confirmed -->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('halcyon_accent_color');
          var colors = {
            green: '#2BFF88',
            red: '#FF2A3D',
            orange: '#FF7A1A',
            blue: '#2D7BFF',
            violet: '#9B5CFF'
          };
          if (saved && colors[saved]) {
            document.documentElement.style.setProperty('--accent', colors[saved]);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
